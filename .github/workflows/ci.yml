name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://app_user:app_password@localhost:5432/app_test
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      PAYMENT_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # S3-compatible storage for the upload tests. LocalStack, not MinIO:
      # MinIO withdrew its community images, so quay.io/minio/minio and
      # Docker Hub's minio/minio both refuse an anonymous pull now.
      - name: Start object storage
        run: |
          docker run -d --name ci-s3 -p 4566:4566 -e SERVICES=s3 localstack/localstack:4
          for i in $(seq 1 60); do
            curl -sf http://localhost:4566/_localstack/health > /dev/null && exit 0
            sleep 2
          done
          echo "Object storage did not come up:"
          docker logs ci-s3 | tail -40
          exit 1

      - name: Prepare test database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          printf 'DATABASE_URL=%s\nAUTH_SECRET=%s\n' "$DATABASE_URL" "$AUTH_SECRET" > .env.test

      - run: npm run lint
      - run: npm run typecheck

      - name: Test
        run: npm test
        env:
          S3_TEST_ENDPOINT: http://localhost:4566
          S3_TEST_ACCESS_KEY_ID: test
          S3_TEST_SECRET_ACCESS_KEY: test

      - name: Build
        run: npm run build
