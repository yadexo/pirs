services:
  postgres:
    image: postgres:17-alpine
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_dev
    # Host port 5433 keeps this clear of any PostgreSQL already installed
    # natively on the default 5432. Update DATABASE_URL if you change it.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for exercising STORAGE_PROVIDER=s3 locally.
  # Not started by default:  docker compose --profile s3 up -d minio
  minio:
    image: quay.io/minio/minio:latest
    container_name: clinic-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
